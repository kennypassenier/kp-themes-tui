[package]
name = "kp-tui-demo"
version = "0.1.0"
edition = "2024"
description = "Research demo: kp-themes tokens as Ratatui themes that switch at runtime"
publish = false
build = "build.rs"

[lib]
name = "kp_tui"
path = "src/lib.rs"

[[bin]]
name = "kp-tui-demo"
path = "src/main.rs"

[features]
default = []
# The same reveal effect written with tachyonfx instead of by hand, so the
# two can be compared on binary size and on code.
tachyonfx = ["dep:tachyonfx"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
# The journal feed reads `journalctl -o json`, whose MESSAGE may be a byte
# array; already a build and dev dependency, so no new crate.
serde_json = "1"
tachyonfx = { version = "0.25", optional = true, default-features = false, features = ["std"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
